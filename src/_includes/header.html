<header class="bg-white/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-200/70 dark:border-gray-800 sticky top-0 z-50">
  <nav class="wrap py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="text-2xl font-extrabold tracking-tight text-gray-900 dark:text-white">
        <a href="{{ "/" | url }}" class="flex items-center gap-2"><span class="inline-block h-3 w-3 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600"></span>Blog</a>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      {% include "nav.html" %}

      <a href="{{ "/search/" | url }}" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white" title="Buscar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </a>

      <button id="theme-toggle" type="button" aria-label="Cambiar a tema oscuro" aria-pressed="false" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
        <svg class="w-5 h-5 sun-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm4.293 1.293a1 1 0 011.414 0l1.414 1.414a1 1 0 11-1.414 1.414l-1.414-1.414a1 1 0 010-1.414zm2.828 4.293a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zm-1.414 5.414l1.414 1.414a1 1 0 11-1.414 1.414l-1.414-1.414a1 1 0 111.414-1.414zM10 16a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zm-4.293 1.293l-1.414 1.414a1 1 0 111.414 1.414l1.414-1.414a1 1 0 11-1.414-1.414zm0-4.586l-1.414-1.414a1 1 0 111.414-1.414l1.414 1.414a1 1 0 11-1.414 1.414zM4 10a1 1 0 011-1h2a1 1 0 110 2H5a1 1 0 01-1-1z" clip-rule="evenodd"></path>
        </svg>
        <svg class="w-5 h-5 moon-icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <details class="md:hidden border-t border-gray-200 dark:border-gray-800">
    <summary aria-label="Abrir menu" class="wrap list-none cursor-pointer select-none py-2 flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 [&::-webkit-details-marker]:hidden">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <span>Menu</span>
    </summary>
    <ul class="wrap pb-3">
      {% for item in navigation.mainNav %}
      <li>
        <a href="{{ item.url | url }}" class="block py-2 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">{{ item.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </details>
</header>
