<!DOCTYPE html>
<html lang="{{ site.language }}" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ description or site.description }}">
  <meta name="author" content="{{ site.author }}">

  <!-- OG Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title or site.title }}">
  <meta property="og:description" content="{{ description or site.description }}">
  <meta property="og:url" content="{{ site.url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%230f172a'>B</text></svg>">

  <title>{{ title or site.title }}</title>
  <script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}try{if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}})()</script>
  <link rel="stylesheet" href="{{ "/css/main.css" | url }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "/feed.xml" | url }}" title="{{ site.title }}">

  {% if analytics.enabled %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics.googleAnalyticsId }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ analytics.googleAnalyticsId }}');
  </script>
  {% endif %}
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors">
  {% include "header.html" %}

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    {{ content | safe }}
  </main>

  {% include "footer.html" %}

  <script src="{{ "/js/theme-toggle.js" | url }}" defer></script>
</body>
</html>
